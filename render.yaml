services:
  - type: web
    name: credi-score
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && PYTHONPATH=src python -m creditlens.train
    startCommand: PYTHONPATH=src uvicorn creditlens.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
